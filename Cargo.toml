[package]
name = "metainjester"
# Calendar versioning: year.month.sequence. The release tag must match exactly.
version = "2026.8.2"
edition = "2024"
description = "Catalogues a directory tree into SQLite and reports what changed on later runs"
license = "MIT"
repository = "https://github.com/do-i/metainjester"

[dependencies]
ctrlc = "3.5.2"
mime_guess = "2.0.5"
rusqlite = "0.40.1"
rustix = { version = "1.1.4", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
toml = "1.1.4"

# Integration tests drive the built binary and then read the database it wrote.
# rusqlite is already a runtime dependency, so this adds nothing to the lock's
# package set and nothing to a `--frozen` release build.
[dev-dependencies]
rusqlite = "0.40.1"
