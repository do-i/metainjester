# Arch package build. Enable Pipelines in Repository settings > Pipelines first.
#
# Push a tag to build and publish:
#     git tag v0.1.0 && git push origin v0.1.0
#
# The tag version must match `version` in Cargo.toml, or the build fails rather
# than shipping a package whose name disagrees with what it contains.
#
# Repository variables (Repository settings > Repository variables), required
# for tag builds because a release nobody can download is a failed release:
#   BB_USER          Bitbucket username (not the email address)
#   BB_APP_PASSWORD  App password with the `repository:write` scope, marked Secured
#
# The `build-package` custom pipeline runs the same build without publishing,
# for checking packaging changes before tagging.

image: archlinux:base-devel

definitions:
  steps:
    - step: &build-arch
        name: Build Arch package
        script:
          # `rust` provides cargo, which is the PKGBUILD's makedepends entry.
          - pacman -Syu --noconfirm --needed rust sqlite git
          - |
            set -euo pipefail
            CARGO_VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
            if [ -n "${BITBUCKET_TAG:-}" ]; then
              VER="${BITBUCKET_TAG#v}"
              if [ "$VER" != "$CARGO_VER" ]; then
                echo "tag $BITBUCKET_TAG implies version $VER, but Cargo.toml says $CARGO_VER."
                echo "bump Cargo.toml and re-tag, so the package matches its contents."
                exit 1
              fi
              if [ -z "${BB_APP_PASSWORD:-}" ] || [ -z "${BB_USER:-}" ]; then
                echo "this is a tag build, but BB_USER / BB_APP_PASSWORD are unset."
                echo "without them the package cannot reach the Downloads page."
                echo "set them in Repository settings > Repository variables."
                exit 1
              fi
            else
              VER="$CARGO_VER"
            fi
            echo "$VER" > .build-version
            echo "building metainjester $VER"
          # makepkg refuses to run as root, so build as an unprivileged user.
          - |
            set -euo pipefail
            VER=$(cat .build-version)
            useradd -m builder
            mkdir -p /build
            cp packaging/arch/PKGBUILD /build/
            sed -i "s/^pkgver=.*/pkgver=$VER/" /build/PKGBUILD
            git archive --format=tar.gz --prefix="metainjester-$VER/" \
              -o "/build/metainjester-$VER.tar.gz" HEAD
            chown -R builder:builder /build
            su builder -c 'cd /build && makepkg -f --noconfirm'
          - |
            set -euo pipefail
            mkdir -p dist
            cp /build/*.pkg.tar.zst dist/
            cd dist && sha256sum *.pkg.tar.zst > SHA256SUMS && cd ..
            ls -la dist/
            cat dist/SHA256SUMS
          # Publish to the repository Downloads page on tag builds.
          - |
            set -euo pipefail
            if [ -z "${BITBUCKET_TAG:-}" ]; then
              echo "not a tag build — package left as a pipeline artifact only"
              exit 0
            fi
            for f in dist/*.pkg.tar.zst dist/SHA256SUMS; do
              echo "uploading $f"
              curl -sS --fail-with-body -X POST \
                -u "$BB_USER:$BB_APP_PASSWORD" \
                "https://api.bitbucket.org/2.0/repositories/$BITBUCKET_REPO_FULL_NAME/downloads" \
                -F files=@"$f"
            done
            echo "published to https://bitbucket.org/$BITBUCKET_REPO_FULL_NAME/downloads/"
        artifacts:
          - dist/**

pipelines:
  tags:
    'v*':
      - step: *build-arch
  custom:
    build-package:
      - step: *build-arch
