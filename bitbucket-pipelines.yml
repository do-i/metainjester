# Arch package build. Enable Pipelines in Repository settings > Pipelines first.
#
# Runs on a tag matching v* (e.g. `git tag v0.1.0 && git push --tags`), or on
# demand from the Pipelines page via the `build-package` custom pipeline.
#
# Repository variables needed for the Downloads upload (Repository settings >
# Repository variables). Omit them and the build still runs — the package is
# always attached as a pipeline artifact either way.
#   BB_USER          Bitbucket username (not the email address)
#   BB_APP_PASSWORD  App password with the `repository:write` scope, marked Secured

image: archlinux:base-devel

definitions:
  steps:
    - step: &build-arch
        name: Build Arch package
        script:
          # The base-devel image ships no keyring refresh; -Syu keeps it current.
          - pacman -Syu --noconfirm --needed rust sqlite git
          # A tag build takes its version from the tag; anything else uses Cargo.toml.
          - |
            if [ -n "$BITBUCKET_TAG" ]; then
              VER="${BITBUCKET_TAG#v}"
            else
              VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
            fi
            echo "building $VER"
          # makepkg refuses to run as root, so build as an unprivileged user.
          - useradd -m builder
          - mkdir -p /build && cp packaging/arch/PKGBUILD /build/
          - git archive --format=tar.gz --prefix="metainjester-$VER/" -o "/build/metainjester-$VER.tar.gz" HEAD
          - sed -i "s/^pkgver=.*/pkgver=$VER/" /build/PKGBUILD
          - chown -R builder:builder /build
          - su builder -c 'cd /build && makepkg -f --noconfirm'
          - mkdir -p dist && cp /build/*.pkg.tar.zst dist/
          - ls -la dist/
          # Upload to the repository Downloads page when credentials are present.
          - |
            if [ -n "$BB_APP_PASSWORD" ]; then
              for f in dist/*.pkg.tar.zst; do
                echo "uploading $f"
                curl -sS --fail -X POST \
                  -u "$BB_USER:$BB_APP_PASSWORD" \
                  "https://api.bitbucket.org/2.0/repositories/$BITBUCKET_REPO_FULL_NAME/downloads" \
                  -F files=@"$f"
              done
            else
              echo "BB_APP_PASSWORD unset — skipping Downloads upload"
            fi
        artifacts:
          - dist/**

pipelines:
  tags:
    'v*':
      - step: *build-arch
  custom:
    build-package:
      - step: *build-arch
