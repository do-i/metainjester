[menu]
title = "metainjester"

[[items]]
id = "build"
label = "Build (debug)"
key = "b"
command = ["cargo", "build"]
group = "Build"

[[items]]
id = "ingest"
label = "Ingest a base path"
key = "i"
command = 'read -r -p "Base path: " p && cargo run -- ingest "$p"'
group = "Run"

[[items]]
id = "prune"
label = "Just prune"
key = "p"
command = ["cargo", "run", "--", "history", "prune", "--apply"]
group = "Maintenance"
tags = ["prune", "history", "retention", "keep_scans", "grow", "size"]
description = "Drop scan history older than history.keep_scans, without walking the tree. Run this after lowering keep_scans. Frees pages for reuse so the database stops growing, but does not shrink the file - use Shrink DB for that"

[[items]]
id = "shrink"
label = "Shrink DB"
key = "v"
command = '''read -r -p "Database [metainjester.sqlite3]: " d; d=${d:-metainjester.sqlite3}; sqlite3 "$d" "VACUUM INTO '$d.new'" && mv -f "$d.new" "$d" && rm -f "$d-wal" "$d-shm" && echo "shrunk $d - reopen SQLiteBrowser, the old inode is gone"'''
group = "Maintenance"
tags = ["vacuum", "shrink", "compact", "reclaim", "disk", "space"]
description = "Rewrite the database into a compact copy and swap it in, returning freed bytes to the filesystem. Prune first, or there is nothing to reclaim. Nothing else may be writing at the time"

[[items]]
id = "test"
label = "Run tests"
key = "t"
command = ["cargo", "test"]
group = "Quality"

[[items]]
id = "check"
label = "Lint"
key = "c"
command = ["cargo", "clippy", "--all-targets", "--", "-D", "warnings"]
group = "Quality"

[[items]]
id = "release-status"
label = "Step 0 - Check release status (changes nothing)"
key = "s"
command = ["scripts/release.sh", "status"]
group = "Release"
tags = ["status", "version", "tag", "develop", "main", "state"]
description = "Show origin develop/main state, unreleased commits, the Cargo.toml version and the next auto version; changes nothing"

[[items]]
id = "release-cut"
label = "Step 1 - Cut release (bump, tag main, start the CI build)"
key = "e"
command = ["scripts/release.sh", "cut"]
group = "Release"
tags = ["tag", "version", "cut", "publish", "develop", "main"]
description = "Bump Cargo.toml on develop, wait for CI, fast-forward main and push the tag atomically. The tag starts arch-package.yml, which builds the package and refreshes the pacman repo"
